name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: VS Code integration (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode
      - name: VS Code integration (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:vscode
      - name: SAP ADT coexistence without a backend
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode -- --adt
      - run: npm run package
      - name: Packaged VSIX install, upgrade and reinstall (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode -- --packaged
      - name: Packaged VSIX install, upgrade and reinstall (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:vscode -- --packaged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-mcp-vsix-${{ runner.os }}
          path: artifacts/workspace-mcp.vsix
          if-no-files-found: error
          retention-days: 14

  verify:
    name: verify
    if: always()
    needs: [platform]
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$PLATFORM_RESULT" = success
