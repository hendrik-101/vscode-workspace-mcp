name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: xvfb-run -a npm run test:vscode
      - name: SAP ADT coexistence without a backend
        run: xvfb-run -a npm run test:vscode -- --adt
      - run: npm run package
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: workspace-mcp-vsix
          path: artifacts/workspace-mcp.vsix
          if-no-files-found: error
          retention-days: 14
