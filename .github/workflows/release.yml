name: Publish tagged release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    # Disabled until the owner explicitly enables repository-level publishing.
    if: vars.RELEASE_PUBLISHING_ENABLED == 'true' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      channel: ${{ steps.metadata.outputs.channel }}
      sha: ${{ steps.metadata.outputs.sha }}
      notes-id: ${{ steps.notes.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate annotated tag and release evidence
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/prepare-tag-release.mjs "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: notes
        with:
          name: release-notes
          path: artifacts/release-notes.md
          if-no-files-found: error
          retention-days: 14

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      pre-release: ${{ needs.validate.outputs.channel == 'preview' }}

  assets:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: workspace-mcp-vsix-Linux
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.notes-id }}
          path: artifacts
      - name: Name and checksum the tested VSIX
        run: |
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          cd artifacts
          mv workspace-mcp.vsix "workspace-mcp-$RELEASE_VERSION.vsix"
          sha256sum "workspace-mcp-$RELEASE_VERSION.vsix" > "workspace-mcp-$RELEASE_VERSION.vsix.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: release-assets
          path: |
            artifacts/workspace-mcp-${{ needs.validate.outputs.version }}.vsix
            artifacts/workspace-mcp-${{ needs.validate.outputs.version }}.vsix.sha256
            artifacts/release-notes.md
          if-no-files-found: error
          retention-days: 14

  github:
    needs: [validate, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.assets.outputs.artifact-id }}
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          case "$RELEASE_CHANNEL" in
            preview) channel_args=(--prerelease --latest=false) ;;
            stable) channel_args=(--latest) ;;
            *) exit 1 ;;
          esac
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$RELEASE_VERSION" --jq '.sha')
          test "$current_sha" = "$RELEASE_SHA"
          cd artifacts
          sha256sum --check "workspace-mcp-$RELEASE_VERSION.vsix.sha256"
          gh release create "v$RELEASE_VERSION" \
            "workspace-mcp-$RELEASE_VERSION.vsix" \
            "workspace-mcp-$RELEASE_VERSION.vsix.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            "${channel_args[@]}" \
            --title "Workspace MCP $RELEASE_VERSION" \
            --notes-file release-notes.md

  marketplace:
    needs: [validate, assets, github]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
      MARKETPLACE_AUTH: ${{ vars.MARKETPLACE_AUTH || 'entra' }}
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.assets.outputs.artifact-id }}
          path: artifacts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked publishing dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Validate publishing setup and checksum
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          case "$MARKETPLACE_AUTH" in
            entra) test -n "$AZURE_CLIENT_ID" && test -n "$AZURE_TENANT_ID" ;;
            pat) ;;
            *) echo "MARKETPLACE_AUTH must be entra or pat" >&2; exit 1 ;;
          esac
          cd artifacts
          sha256sum --check "workspace-mcp-$RELEASE_VERSION.vsix.sha256"
      - name: Authenticate with Microsoft Entra workload federation
        if: env.MARKETPLACE_AUTH == 'entra'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish exact VSIX to Marketplace with Entra
        if: env.MARKETPLACE_AUTH == 'entra'
        run: |
          case "$RELEASE_CHANNEL" in
            preview) channel_args=(--pre-release) ;;
            stable) channel_args=() ;;
            *) exit 1 ;;
          esac
          ./node_modules/.bin/vsce publish --azure-credential --packagePath "artifacts/workspace-mcp-$RELEASE_VERSION.vsix" "${channel_args[@]}"
      - name: Publish exact VSIX with explicitly selected PAT authentication
        if: env.MARKETPLACE_AUTH == 'pat'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          test -n "$VSCE_PAT"
          case "$RELEASE_CHANNEL" in
            preview) channel_args=(--pre-release) ;;
            stable) channel_args=() ;;
            *) exit 1 ;;
          esac
          ./node_modules/.bin/vsce publish --packagePath "artifacts/workspace-mcp-$RELEASE_VERSION.vsix" "${channel_args[@]}"
